<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const URL_GAME="https://salmamurodahputrisasa12-tech.github.io/KeranjangAjaib/Keranjang%20Ajaib.html";
 
/* ---------- Musik latar (nada sederhana dibuat dengan WebAudio) ---------- */
let ac,musOn=false,timer,step=0;
const fq=m=>440*2**((m-69)/12);
function tone(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}
/* Lagu berubah terus: 4 akor (C, Am, F, G), bas, arpeggio, dan melodi acak. Tiap 8 birama nadanya naik atau turun. */
const prog=[[48,[0,4,7]],[45,[0,3,7]],[41,[0,4,7]],[43,[0,4,7]]],pent=[0,2,4,7,9,12,14,16],keys=[0,2,5,-2,7,0];
let bar=0,mi=3,mel0=[];
function tick(){
  const b=step%8,t=ac.currentTime;if(!b){bar++}
  const tr=keys[(bar>>3)%keys.length],[root,ch]=prog[bar%4],R=root+tr;
  if(b===0||b===4||(b===6&&Math.random()<.4))tone(fq(R),t,.45,'sine',.12);
  tone(fq(R+24+ch[[0,1,2,1,2,1,0,2][b]%3]),t,.22,'triangle',.035);
  const p=b%2?.4:.75;
  if(Math.random()<p){mi=Math.max(0,Math.min(7,mi+[-2,-1,-1,0,1,1,2][Math.random()*7|0]));tone(fq(60+tr+pent[mi]),t,.3,Math.random()<.5?'sine':'triangle',.07)}
  if(b===0&&bar%4===3)tone(fq(72+tr),t,.8,'sine',.06);
  step++;
}
function toggleMusic(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  musOn=!musOn;
  if(musOn){ac.resume();timer=setInterval(tick,200)}else clearInterval(timer);
  $('#mus').textContent=musOn?'🔊':'🔇';
}
$('#mus').onclick=toggleMusic;
let lp={x:innerWidth/2,y:innerHeight/2};
document.addEventListener('pointerdown',e=>{lp={x:e.clientX,y:e.clientY}},true);
function sparkle(){for(let i=0;i<12;i++){const s=document.createElement('div');s.className='burst';s.textContent=['✨','⭐','🌟','💫'][i%4];const a=Math.PI*2*i/12,d=55+Math.random()*55;s.style.cssText=`left:${lp.x}px;top:${lp.y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
function beep(ok){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){return}
  const t=ac.currentTime;
  if(ok){sparkle();[784,988,1319,1568,2093].forEach((f,i)=>tone(f,t+i*.06,.2,'sine',.09))}
  else{tone(190,t,.13,'square',.08);tone(190,t+.19,.2,'square',.08)}
}

function say(id,t,k){const m=$(id);m.textContent=t;m.className='msg '+(k||'');}
function finder(box,mid,rounds){let r=0;const B=$(box);
  const draw=()=>{
    if(r>=rounds.length){B.innerHTML='';say(mid,'Hebat! Semua tantangan selesai! 🎉','ok');beep(1);return}
    const R=rounds[r];say(mid,R.p);
    B.innerHTML=shuffle(R.tiles).map(t=>`<button class="item bg${t.bg}" data-ok="${t.ok?1:0}"><span class="e" style="font-size:${t.s||64}px">${t.e}</span><span class="n">${t.n}</span></button>`).join('');
    let left=R.tiles.filter(t=>t.ok).length;
    $$('.item',B).forEach(b=>b.onclick=()=>{if(b.dataset.done)return;
      if(b.dataset.ok==='1'){beep(1);b.dataset.done=1;b.style.opacity=.6;b.style.outline='6px solid #2fa84f';left--;say(mid,R.good(b.querySelector('.n').textContent),'ok');if(!left)setTimeout(()=>{r++;draw()},1500)}
      else{beep(0);b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),450);say(mid,R.bad,'no')}});
  };draw()}
function initFindShape(){
  const all=shapes.flatMap(s=>s.items.map(([n,e])=>({n,e,g:s.g})));
  finder('#fb4','#f4',shapes.map(s=>({p:`Temukan semua benda berbentuk ${s.g.toLowerCase()}!`,tiles:all.map(t=>({...t,bg:'W',ok:t.g===s.g})),good:()=>'Hebat! Kamu menemukan benda yang memiliki bentuk sama!',bad:'Belum tepat. Ayo lihat bentuknya sekali lagi!'})));
}

  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();const t=ac.currentTime;[523,659,784,1047,784,1047,1319].forEach((n,i)=>tone(n,t+i*.12,.3,'triangle',.1))}catch(e){}
}

  if(!window._gk){window._gk=1;
    const m={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'j',w:'j',' ':'j'};

  function start(){const R=rounds[r];px=30;py=GY-40;vy=0;on=true;got=0;lock=false;need=R.ok.length;

  function loop(t){
    if(!cv.isConnected)return;

        else{beep(0);lock=true;say(msg,`${R.bad(o.n)} Ayo mulai dari awal lagi, ya! 💪`,'no');setTimeout(()=>{if(cv.isConnected)start()},1800)}
        return false}
      return true});
    if(!lock&&px>W-120){
      if(got>=need){lock=true;lp={x:rc.left+rc.width*.7,y:rc.top+rc.height*.5};beep(1);hore(r===2);
        say(msg,r<2?`Level ${r+1} selesai! HOREEE! Hebat! 🎉`:'HOREEE! Kamu menyelesaikan semua petualangan! 🏆','ok');

    c.fillStyle='#8ee06e';for(let i=0;i<9;i++){const x=((i*300-cam*.5)%2700+2700)%2700-200;c.beginPath();c.arc(x,335,120,Math.PI,0);c.fill()}
    for(const p of P){const sx=p.x-cam;
      if(p===P[0]){c.fillStyle='#9b6b3a';c.fillRect(0,GY,800,40);c.fillStyle='#4fc24d';c.fillRect(0,GY,800,12)}
      else{c.fillStyle='#c98b4a';c.fillRect(sx,p.y,p.w,18);c.fillStyle='#4fc24d';c.fillRect(sx,p.y,p.w,7);c.fillStyle='#0003';for(let x=sx+25;x<sx+p.w;x+=25)c.fillRect(x,p.y+7,2,11)}}
    for(const o of it){const bx=o.x-cam,by=o.y+Math.sin(t/250+o.x)*4;c.beginPath();c.arc(bx,by,o.s*.78,0,7);c.fillStyle='#fff';c.fill();c.lineWidth=4;c.strokeStyle='#1b1a33';c.stroke();c.font=`${o.s}px serif`;c.fillText(o.e,bx,by+2)}
    c.font='52px serif';c.fillText('🏁',W-70-cam,GY-30);
    {const cx=px+17-cam,tp=py,L=(x1,y1,x2,y2,col,w)=>{c.lineCap='round';c.strokeStyle='#1b1a33';c.lineWidth=w+5;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()};
      const la=on?Math.sin(ph)*.9:.8,aa=on?-Math.sin(ph)*1.0:2.5,hy=tp+27,sy=tp+19;
      L(cx,hy,cx+Math.sin(-la)*13,hy+Math.cos(la)*13,'#1f4fc0',7);
      L(cx,hy,cx+Math.sin(la)*13,hy+Math.cos(la)*13,'#2f6fe8',7);
      L(cx,sy,cx+Math.sin(-aa)*12,sy+Math.cos(aa)*12,'#c92f27',6);
      L(cx,tp+18,cx,tp+28,'#e8433a',11);
      L(cx,sy,cx+Math.sin(aa)*12,sy+Math.cos(aa)*12,'#ff5a4f',6);
      c.beginPath();c.arc(cx,tp+9,10,0,7);c.fillStyle='#ffcf99';c.fill();c.lineWidth=3;c.strokeStyle='#1b1a33';c.stroke();
      c.beginPath();c.arc(cx,tp+8,10,Math.PI,0);c.fillStyle='#5a3416';c.fill();c.stroke();
      c.fillStyle='#1b1a33';c.beginPath();c.arc(cx+4*fd,tp+11,1.9,0,7);c.fill()}
    requestAnimationFrame(loop)}
  start();requestAnimationFrame(loop);
}
function initReflect(){
  const v={},pg=[3,4,5,6],nm=['Bentuk','Warna','Ukuran','Cara pengelompokan'];
  function upd(){
    if(Object.keys(v).length<4){say('#rmsg','Bagus! Pilih wajah untuk pernyataan lainnya.');return}
    const weak=Object.keys(v).filter(k=>v[k]<2);

    say('#rmsg','Tidak apa-apa. Belajar itu butuh waktu. Ayo ulangi bagian yang masih membuatmu bingung, ya!','ok');
    $('#rlink').innerHTML=weak.map(k=>`<button class="btn yel" style="margin:6px;font-size:18px" data-go="${pg[k]}">Ulangi: ${nm[k]}</button>`).join('');
    $$('[data-go]',$('#rlink')).forEach(b=>b.onclick=()=>show(order.indexOf(+b.dataset.go)));
  }
  $$('[data-row]').forEach(row=>$$('.opt',row).forEach(b=>b.onclick=()=>{$$('.opt',row).forEach(x=>x.classList.remove('pick'));b.classList.add('pick');v[row.dataset.row]=+b.dataset.v;beep(1);upd()}));
  $$('[data-fav]').forEach(b=>b.onclick=()=>{$$('[data-fav]').forEach(x=>x.classList.remove('pick'));b.classList.add('pick');beep(1);say('#fmsg',`Wah, kamu suka ${b.dataset.fav}! Terima kasih sudah belajar bersama.`,'ok')});
}
function initLKPD(){
  const d1={items:[['Bola','⚽','Lengkung'],['Pizza','🍕','Segitiga'],['Buku','📕','Segi empat'],['Piring','🍽️','Lengkung'],['Penggaris','📐','Segitiga'],['Pintu','🚪','Segi empat']],baskets:[['Lengkung','G'],['Segitiga','Y'],['Segi empat','R']]};
  const d2={items:[['Apel','🍎','Merah'],['Pisang','🍌','Kuning'],['Daun','🍃','Hijau'],['Tomat','🍅','Merah'],['Bunga matahari','🌻','Kuning'],['Katak','🐸','Hijau']],baskets:[['Merah','R'],['Kuning','Y'],['Hijau','G']]};
  function mk(id,d){
    const box=$(id);
    box.innerHTML=`<div class="cl">${d.items.map((it,i)=>`<button class="item sm bgW" data-i="${i}"><span class="e">${it[1]}</span><span class="n">${it[0]}</span></button>`).join('')}</div><svg></svg><div class="cr">${d.baskets.map(b=>`<button class="cb ${b[1]}" data-b="${b[0]}">${b[0]}</button>`).join('')}</div>`;
    const links={},svg=$('svg',box);let sel=null,res=0;
    box.draw=()=>{const bb=box.getBoundingClientRect();svg.innerHTML=Object.entries(links).map(([i,b])=>{const a=$(`.item[data-i="${i}"]`,box).getBoundingClientRect(),c=$(`.cb[data-b="${b}"]`,box).getBoundingClientRect();const col=res?(d.items[i][2]===b?'#2fa84f':'#e8433a'):'#4a7fe0';return `<line x1="${a.right-bb.left}" y1="${a.top+a.height/2-bb.top}" x2="${c.left-bb.left}" y2="${c.top+c.height/2-bb.top}" stroke="${col}" stroke-width="6" stroke-linecap="round"/>`}).join('')};
    $$('.item',box).forEach(b=>b.onclick=()=>{$$('.item',box).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b.dataset.i});
    $$('.cb',box).forEach(b=>b.onclick=()=>{if(sel===null)return;links[sel]=b.dataset.b;res=0;sel=null;$$('.item',box).forEach(x=>x.classList.remove('sel'));box.draw()});
    box.check=()=>{if(Object.keys(links).length<d.items.length)return null;res=1;box.draw();return d.items.filter((it,i)=>links[i]===it[2]).length};
    return box}
  const b1=mk('#lk1',d1),b2=mk('#lk2',d2);
  $('#lk3').innerHTML=[['⚽','Bola'],['🍎','Apel'],['⭐','Bintang']].map(([e,n])=>`<div class="row" style="align-items:flex-end;margin:10px 0">${shuffle([[1,96],[0,38]]).map(([big,s])=>`<button class="item bgW" style="position:relative" data-big="${big}" data-m="0"><span class="e" style="font-size:${s}px">${e}</span><span class="n">${n}</span></button>`).join('')}</div>`).join('');
  $$('#lk3 .item').forEach(b=>b.onclick=()=>{b.dataset.m=(+b.dataset.m+1)%3});
  const s3=()=>{const t=$$('#lk3 .item');if(t.some(x=>x.dataset.m==='0'))return null;return t.filter(x=>(x.dataset.big==='1'&&x.dataset.m==='1')||(x.dataset.big==='0'&&x.dataset.m==='2')).length};
  $$('[data-c]').forEach(b=>b.onclick=()=>{const k=b.dataset.c,s=k==='1'?b1.check():k==='2'?b2.check():s3();
    if(s===null)say('#lm'+k,'Isi semua dulu, ya!');
    else if(s===6){beep(1);say('#lm'+k,'Hebat! Semua benar! 🎉','ok')}
    else{beep(0);say('#lm'+k,`Kamu benar ${s} dari 6. Ayo perbaiki yang belum tepat, ya!`,'no')}});
  $('#lk-done').onclick=()=>{const a=[b1.check(),b2.check(),s3()];
    if(a.includes(null)){say('#lm-all','Selesaikan semua bagian dulu, ya!');return}
    const tot=a[0]+a[1]+a[2],nm=$('#lk-name').value.trim();
    say('#lm-all',`${nm?nm+', ':''}skor LKPD kamu ${tot} dari 18 (Nilai ${Math.round(tot/18*100)}). ${tot>=15?'Luar biasa! Kamu hebat! 🌟':tot>=10?'Bagus! Sedikit lagi kamu hebat! 💪':'Terus semangat! Coba lagi, kamu pasti bisa! 😊'}`,'ok');if(tot>=10)beep(1);
    mailBox($('#lk-mail'),n2=>({s:`Hasil LKPD Matematika - ${n2}`,b:`Hasil LKPD: Mengelompokkan Benda (Matematika Kelas 1)\nNama: ${n2}\nBagian 1 (Bentuk): ${a[0]} dari 6\nBagian 2 (Warna): ${a[1]} dari 6\nBagian 3 (Ukuran): ${a[2]} dari 6\nSkor: ${tot} dari 18\nNilai: ${Math.round(tot/18*100)}`}),nm)};
  window.onresize=()=>{if(b1.isConnected){b1.draw();b2.draw()}};
}
const GURU_EMAIL='';
function mailBox(el,getData,name0){
  const st='font:inherit;font-size:20px;padding:8px 12px;border-radius:14px;border:3px solid #c9cbe0;width:min(100%,360px);margin:4px 0;color:#2b2a4c;background:#fff';
  el.innerHTML=`<div class="card" style="margin-top:16px"><h3>✉️ Kirim Hasil ke Guru</h3><p>Isi namamu dan email gurumu. Tekan Kirim, lalu aplikasi email akan terbuka. Tekan Kirim di aplikasi email itu.</p><input data-k="nm" placeholder="Nama kamu" style="${st}"><br><input data-k="to" type="email" placeholder="Email guru" style="${st}"><div class="row" style="margin-top:10px"><button class="btn" data-send style="font-size:20px;padding:10px 24px">Kirim ke Email Guru</button><button class="btn yel" data-copy style="font-size:20px;padding:10px 24px">Salin Hasil</button></div><div class="msg" data-mm style="margin-bottom:0"></div></div>`;
  const g=k=>$(`[data-k="${k}"]`,el),mm=$('[data-mm]',el);
  let saved='';try{saved=localStorage.getItem('guruEmail')||''}catch(e){}
  g('to').value=saved||GURU_EMAIL;g('nm').value=name0||'';
  $('[data-send]',el).onclick=()=>{
    const to=g('to').value.trim(),nm=g('nm').value.trim();
    if(!nm){mm.className='msg no';mm.textContent='Tulis namamu dulu, ya.';return}
    if(!/^\S+@\S+\.\S+$/.test(to)){mm.className='msg no';mm.textContent='Tulis email guru dengan benar, ya.';return}
    try{localStorage.setItem('guruEmail',to)}catch(e){}
    const d=getData(nm),url=`mailto:${to}?subject=${encodeURIComponent(d.s)}&body=${encodeURIComponent(d.b)}`;
    const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
    mm.className='msg ok';mm.innerHTML=`Email siap dikirim! Kalau belum terbuka, <a href="${url}" target="_blank" rel="noopener">klik di sini</a> atau tekan Salin Hasil.`;beep(1)};
  $('[data-copy]',el).onclick=async()=>{
    const d=getData(g('nm').value.trim()||'Murid');
    try{await navigator.clipboard.writeText(d.b);mm.className='msg ok';mm.textContent='Hasil sudah disalin. Tempel di pesan ke gurumu.'}
    catch(e){mm.className='msg no';mm.textContent='Hasil belum bisa disalin otomatis. Coba tombol Kirim ke Email Guru.'}};
}
function sorter(tray,bs,msgId,items,baskets,okTxt,noTxt){
  let sel=null;const T=$(tray),B=$(bs);
  T.innerHTML=shuffle(items).map((it,i)=>`<button class="item bg${it.bg}" data-i="${i}" data-grp="${it.grp}" data-n="${it.n}" data-e="${it.e}"><span class="e" style="font-size:${it.s||64}px">${it.e}</span><span class="n">${it.n}</span></button>`).join('');
  B.innerHTML=baskets.map(b=>basket(b.c,b.l,`data-grp="${b.l}"`)).join('');
  $$('.item',T).forEach(b=>b.onclick=()=>{$$('.item',T).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b});
  $$('.basket',B).forEach(k=>k.onclick=()=>{
    if(!sel){say(msgId,'Pilih bendanya dulu, ya!');return}
    if(sel.dataset.grp===k.dataset.grp){beep(1);
      $('.body',k).insertAdjacentHTML('beforeend',`<span class="mini">${sel.dataset.e}</span>`);
      say(msgId,okTxt(sel.dataset.n,k.dataset.grp),'ok');sel.remove();sel=null;
      if(!$$('.item',T).length)say(msgId,'Semua benda sudah masuk keranjang. Hebat sekali! 🎉','ok');
    }else{beep(0);sel.classList.add('wrong');const s=sel;setTimeout(()=>s.classList.remove('wrong'),450);say(msgId,noTxt,'no')}
  });
}
function initColor(){
  const all=colors.flatMap(c=>c.items.map(([n,e])=>({n,e,g:c.g,bg:c.c})));
  finder('#t2','#m2',colors.map(c=>({p:`Temukan semua benda berwarna ${c.g.toLowerCase()}!`,tiles:all.map(t=>({...t,ok:t.g===c.g})),good:n=>`Benar! ${n} masuk ke kelompok warna ${c.g.toLowerCase()}.`,bad:'Belum tepat. Ayo perhatikan warna bendanya sekali lagi!'})));
}
function initSize(){
  const rs=[[0,1],[1,0],[2,1],[0,0],[1,1],[2,0]];
  finder('#t3','#m3',rs.map(([k,big])=>{const [n,e]=sizes[k];return{p:`Mana ${n.toLowerCase()} yang ${big?'BESAR':'KECIL'}?`,tiles:[{n,e,bg:'W',s:100,ok:!!big},{n,e,bg:'W',s:38,ok:!big}],good:()=>'Bagus! Kamu berhasil membedakan benda besar dan kecil.',bad:'Coba bandingkan ukuran kedua benda sekali lagi, ya!'}}));

function initHow(){
  const t={Bentuk:'Berdasarkan bentuk: apel itu bulat, jadi masuk kelompok lengkung. 🔵',Warna:'Berdasarkan warna: apel ini berwarna merah, jadi masuk kelompok merah. 🔴',Ukuran:'Berdasarkan ukuran: apel yang ditampilkan ini kecil, jadi masuk kelompok kecil. 🤏'};
  $$('[data-how]').forEach(b=>b.onclick=()=>{beep(1);say('#m7',t[b.dataset.how],'ok')});
}
function quiz(el,qs,doneKey){
  const E=$(el);let i=0,score=0,pick=null,checked=false,res=[],ans=[];
  const draw=()=>{
    if(i>=qs.length){const pct=score/qs.length;
      E.innerHTML=`<div class="card center"><div class="stars">${'⭐'.repeat(Math.max(1,Math.round(pct*3)))}</div><h2>Skor kamu: ${score} dari ${qs.length} (Nilai ${Math.round(score/qs.length*100)})</h2>
      <p class="big">${pct>=.8?'Luar biasa! Kamu pintar sekali!':pct>=.5?'Bagus! Sedikit lagi kamu hebat!':'Terus semangat! Ayo coba lagi, kamu pasti bisa!'}</p>
      <div style="text-align:left">${res.map((r,k)=>`<p>${r?'✅':'🟡'} Soal ${k+1}: ${qs[k].e}</p>`).join('')}</div>
      <button class="btn red" id="again">Coba Lagi</button><div id="ev-mail"></div></div>`;
      $('#again').onclick=()=>{i=0;score=0;res=[];ans=[];pick=null;checked=false;draw()};
      mailBox($('#ev-mail'),nm=>({s:`Hasil Evaluasi Matematika - ${nm}`,b:`Hasil Evaluasi: Mengelompokkan Benda (Matematika Kelas 1)\nNama: ${nm}\nSkor: ${score} dari ${qs.length}\nNilai: ${Math.round(score/qs.length*100)}\n\nRincian:\n`+qs.map((q,k)=>`Soal ${k+1}: ${res[k]?'Benar':'Salah'} (jawaban murid: ${q.o[ans[k]]})`).join('\n')}));return}
    const q=qs[i];
    E.innerHTML=`<p class="big">Soal ${i+1} dari ${qs.length}</p><div class="prog"><i style="width:${i/qs.length*100}%"></i></div>
    <div class="card"><div class="qpic">${q.p}</div><p class="big center">${q.q}</p>
    <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${'ABC'[k]}. ${o}</button>`).join('')}</div>
    <div class="msg" id="qm">Pilih satu jawaban, lalu tekan Periksa Jawaban.</div>
    <div class="center"><button class="btn yel" id="chk">Periksa Jawaban</button></div></div>`;
    pick=null;checked=false;
    $$('.opt',E).forEach(b=>b.onclick=()=>{if(checked)return;$$('.opt',E).forEach(x=>x.classList.remove('pick'));b.classList.add('pick');pick=+b.dataset.k});
    $('#chk').onclick=()=>{
      if(checked){i++;draw();return}
      if(pick===null){say('#qm','Pilih jawabanmu dulu, ya!');return}
      checked=true;const ok=pick===q.a;if(ok)score++;res.push(ok);ans.push(pick);beep(ok);
      $$('.opt',E).forEach((b,k)=>{b.classList.remove('pick');if(k===q.a)b.classList.add('right');else if(k===pick)b.classList.add('bad')});
      say('#qm',(ok?'Benar! Hebat! ':'Belum tepat, tidak apa-apa. ')+q.e,ok?'ok':'no');
      $('#chk').textContent=i===qs.length-1?'Lihat Skor':'Soal Berikutnya';
    };
  };draw();
}

let cur=0;const seen=new Set();
const dots=$('#dots');const order=[0,2,11,1,3,4,5,6,7,12,8,9,10];
dots.innerHTML=order.map((id,i)=>`<button data-p="${i}" aria-label="${names[id]}">${i+1}</button>`).join('');
function show(n){
  cur=Math.max(0,Math.min(pages.length-1,n));seen.add(cur);
  $('#app').innerHTML=`<section class="show">${pages[order[cur]]()}</section>`;
  $$('#dots button').forEach((b,i)=>{b.className=i===cur?'on':seen.has(i)?'done':''});
  $('#prev').style.visibility=cur?'visible':'hidden';
  $('#next').style.visibility=cur<pages.length-1?'visible':'hidden';
  const id=order[cur];if(id===3)initShapes();if(id===4)initColor();if(id===5)initSize();if(id===6)initHow();
  if(id===7)initGame();if(id===12)initLKPD();if(id===10)initReflect();if(id===9)quiz('#quiz2',evaluasi);
  $$('[data-go]').forEach(b=>b.onclick=()=>show(order.indexOf(+b.dataset.go)));
  window.scrollTo({top:0,behavior:'smooth'});
}
$('#prev').onclick=()=>show(cur-1);$('#next').onclick=()=>show(cur+1);
dots.onclick=e=>{const b=e.target.closest('[data-p]');if(b)show(+b.dataset.p)};
show(0);
